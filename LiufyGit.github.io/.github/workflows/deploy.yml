name: Deploy MkDocs
on:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MkDocs Material
        run: pip install mkdocs-material
      - name: Build & Deploy to GitHub Pages
        run: mkdocs gh-deploy --force
